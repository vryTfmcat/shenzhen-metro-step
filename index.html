<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>地铁单步导航</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="shell mast">
      <div class="brand">
        <span class="mark" aria-hidden="true"><span class="mark-window"><img id="metro-mark" alt="" decoding="async"></span></span>
        <div>地铁单步导航<small>深圳地铁</small></div>
      </div>
      <button type="button" class="quiet" id="key-open">高德设置</button>
    </div>
  </header>
  <main class="shell">
    <section id="planner">
      <div class="intro">
        <span class="intro-rail" aria-hidden="true"></span>
        <h1>这次去哪？</h1>
        <p>输入站名，或在线路图上选站。</p>
      </div>
      <div class="planner-grid">
        <div>
          <form class="card fields" id="plan-form">
            <div class="station-fields">
              <div class="place" id="origin-field">
                <label for="origin">起点</label>
                <div class="input-row"><input id="origin" placeholder="例如 上芬" maxlength="60" autocomplete="off"><button class="soft open-map" type="button">地图选站</button></div>
                <div class="suggestions" hidden></div>
              </div>
              <div class="place" id="destination-field">
                <label for="destination">终点</label>
                <div class="input-row"><input id="destination" placeholder="例如 田贝" maxlength="60" autocomplete="off"><button class="soft open-map" type="button">地图选站</button></div>
                <div class="suggestions" hidden></div>
              </div>
            </div>
            <button type="submit" class="primary" id="plan-button">规划地铁路线<span aria-hidden="true">→</span></button>
            <p class="feedback" id="plan-status" role="status" hidden></p>
          </form>
          <section id="choices" class="card" hidden aria-label="备选路线"></section>
          <button type="button" class="soft" id="return-trip" hidden>回到当前行程</button>
        </div>
        <div class="auxiliary">
          <button type="button" class="demo" id="demo-button"><span>试走示例<small>购物公园 → 会展中心换乘 → 上梅林</small></span><span class="demo-arrow" aria-hidden="true">→</span></button>
          <details class="card import" id="import-panel">
            <summary>导入高德链接或路线文件</summary>
            <p>支持带起终点的高德 URI（重新算路），或 Web 服务公交接口的 JSON（保留原方案）。</p>
            <label for="import-text">粘贴路线链接或 JSON</label>
            <textarea id="import-text" rows="3" placeholder="https://uri.amap.com/navigation?…"></textarea>
            <div class="actions">
              <button type="button" class="soft" id="import-button">导入</button>
              <label for="import-file" class="file-label">选择 JSON 文件<input type="file" id="import-file" accept=".json,application/json"></label>
            </div>
          </details>
        </div>
      </div>
    </section>
    <section id="trip" hidden aria-label="当前行程">
      <div class="trip-top">
        <span id="trip-label"></span>
        <button type="button" id="trip-menu" class="quiet">行程选项</button>
      </div>
      <progress id="progress-fill" value="0" aria-label="行程进度"></progress>
      <div id="step" class="card step" aria-labelledby="step-title"></div>
      <p id="trip-status" class="feedback" role="status" hidden></p>
    </section>
  </main>
  <dialog id="key-dialog">
    <form id="key-form">
      <h2>连接高德</h2>
      <p>在控制台的「应用管理 → 我的应用」添加类型为「Web 服务」的 Key。Key 仅保存在本机服务的运行内存中。</p>
      <a href="https://console.amap.com/dev/index" target="_blank" rel="noopener noreferrer">打开高德控制台 ↗</a>
      <label for="key">Web 服务 Key</label>
      <input id="key" type="password" required maxlength="32" autocomplete="off" spellcheck="false">
      <p id="key-status" class="feedback" role="status" hidden></p>
      <div class="actions"><button type="submit" class="primary">测试并连接</button><button type="button" class="quiet close">关闭</button></div>
    </form>
  </dialog>
  <dialog id="options">
    <h2>行程选项</h2>
    <div class="menu">
      <button type="button" class="soft" id="pause">暂停导航</button>
      <button type="button" class="soft" id="skip">跳过当前提示</button>
      <button type="button" class="soft" id="change">从现在的位置重新规划</button>
      <button type="button" class="soft" id="export">下载离线行程</button>
      <button type="button" class="soft" id="restart" hidden>从头开始</button>
      <button type="button" class="soft" id="exit">退出行程</button>
      <button type="button" class="quiet close">返回</button>
    </div>
  </dialog>
  <dialog id="station-map" aria-labelledby="map-prompt">
    <div class="map-heading">
      <h2 id="map-prompt">请点选起点站</h2>
      <button type="button" class="quiet close">关闭</button>
    </div>
    <div class="map-endpoints">
      <button type="button" id="map-origin" class="soft">起点</button>
      <button type="button" id="map-destination" class="soft">终点</button>
    </div>
    <div class="map-tools">
      <label for="map-line">线路</label>
      <select id="map-line"><option value="">全部线路</option></select>
      <button type="button" id="map-zoom-out" class="soft" aria-label="缩小地图">−</button>
      <button type="button" id="map-zoom-in" class="soft" aria-label="放大地图">＋</button>
    </div>
    <div id="map-view" tabindex="0" aria-label="滚动浏览线路图并点选车站"></div>
    <p class="map-note">拖动浏览，点站名或站点选择。<a href="https://www.amap.com/ssr/subway/shenzhen-4403" target="_blank" rel="noopener noreferrer">线网来源</a></p>
  </dialog>
